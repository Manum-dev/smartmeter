<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Meter Analyst | Ampere Transition</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF per la generazione di report PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <header>
        <h1>Smart Meter Analyst</h1>
        <div class="status-badge">Ollama: Llama 3.2 Active</div>
    </header>

    <div class="container">
        <!-- Left Panel: Energy Data -->
        <div class="dashboard-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <h2>Energy Performance Dashboard</h2>
                <button class="btn-secondary" id="btn-export">Export PDF</button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <p>Total Consumption</p>
                    <h3 id="stat-consumo">- kWh</h3>
                </div>
                <div class="stat-card">
                    <p>Solar Production</p>
                    <h3 id="stat-produzione">- kWh</h3>
                </div>
                <div class="stat-card">
                    <p>Self-Consumption</p>
                    <h3 id="stat-autoconsumo">- %</h3>
                </div>
                <div class="stat-card">
                    <p>Night Consumption</p>
                    <h3 id="stat-notturno">- %</h3>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="energyChart"></canvas>
            </div>
        </div>

        <!-- Right Panel: Chat AI -->
        <div class="chat-panel">
            <div class="chat-messages" id="chat-messages">
                <div class="message ai">
                    Hello! I am your <Energy assistant. I have analyzed your smart meter data. How can I help you optimize your energy consumption today?
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="user-input" placeholder="Ask the AI (e.g. where am I wasting energy?)...">
                <button class="btn" id="btn-send">Send</button>
            </div>
        </div>
    </div>

    <!-- Collegamento al file JS esterno alla fine del body -->
    <script src="/static/app.js"></script>
</body>
</html>
